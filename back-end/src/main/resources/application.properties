spring.application.name=tick-tracker

# H2 stored as a file, so data survives restarts. Relative to where you run the app (back-end/).
spring.datasource.url=jdbc:h2:file:./data/ticks
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/updates tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browser DB viewer, useful for checking data while developing
spring.h2.console.enabled=true

elanco.api.base-url=https://dev-task.elancoapps.com/data
elanco.api.max-attempts=3
elanco.api.retry-wait-ms=5000
elanco.seed-file=samples/tick-sightings.json

app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB